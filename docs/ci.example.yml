# Optional GitHub Actions template. This file is not active.
# Copy it to .github/workflows/ci.yml when the git login can update workflow files.
# The current origin token can push source but cannot create workflow paths.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: npm ci, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build standalone page
        run: npm run build
