<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122128"><title>Fencefall · 最后一道防线</title><style>
/* src/styles.css */
:root {
  color-scheme: dark;
  --bg: #0b1318;
  --bg-raised: #132028;
  --bg-card: #192b33;
  --hud: #0d181f;
  --ink: #f3efe4;
  --muted: #9eb4bc;
  --line: #34525c;
  --brass: #c8a25a;
  --gold: #e6c574;
  --gold-ink: #1b1307;
  --ok: #78d29c;
  --danger: #e45d4a;
  --xp: #7cc0e0;
  --cyan: #8edcf2;
  --focus: #f4d075;
  --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background:
    radial-gradient(900px 520px at 50% -6%, rgba(42, 82, 98, 0.48) 0%, transparent 62%),
    radial-gradient(620px 420px at 50% 92%, rgba(154, 110, 46, 0.16) 0%, transparent 68%),
    linear-gradient(180deg, #0d1820 0%, #091015 100%);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  height: 100vh;
  height: 100dvh;
  max-width: none;
  margin: 0;
  padding: 0;
}

h1, h2, h3, h4 { font-weight: 700; line-height: 1.25; }
h1 { font-size: 1.35rem; margin: 0 0 8px; }
h2 { font-size: 1.12rem; margin: 0 0 8px; }
h3, h4 { font-size: 1rem; margin: 0 0 6px; }
p { margin: 0 0 8px; overflow-wrap: break-word; }
p:last-child { margin-bottom: 0; }
small { color: var(--muted); }

button, input, select, textarea { font: inherit; color: inherit; }

button, .btn,
[data-ui="overlay"] button,
[data-ui="panel"] button,
[data-ui="menu"] button {
  appearance: none;
  min-height: 44px;
  min-width: 44px;
  height: auto;
  padding: 8px 12px;
  white-space: normal;
  overflow-wrap: anywhere;
  border-radius: 10px;
  border: 1px solid rgba(114, 156, 166, 0.42);
  background: linear-gradient(180deg, #1f3740 0%, #15272f 100%);
  color: var(--ink);
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  max-width: 100%;
  transition: border-color 140ms ease, background 140ms ease, transform 100ms ease, box-shadow 140ms ease;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(180deg, #efd084 0%, #d5ad52 100%);
  border-color: #f7e3ae;
  color: var(--gold-ink);
  font-weight: 700;
  box-shadow: 0 2px 10px rgba(230, 197, 116, 0.28);
}

.btn.is-active {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold);
}

.btn-primary.is-active { box-shadow: inset 0 0 0 2px #1b1307, 0 2px 10px rgba(230, 197, 116, 0.35); }

.btn:disabled, button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn:active:not(:disabled), button:active:not(:disabled) { transform: translateY(1px); }

.panel {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  min-width: 0;
  box-shadow: var(--shadow);
}

.card {
  background: var(--bg-card);
  border: 1px solid rgba(110, 152, 162, 0.36);
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
  color: var(--ink);
}

button.card, .card[role="button"] {
  display: block;
  width: 100%;
  text-align: start;
  cursor: pointer;
}

.grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
  min-width: 0;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  min-width: 0;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.muted { color: var(--muted); }

.result-story {
  margin: 0 0 10px;
  line-height: 1.45;
  white-space: normal;
  overflow-wrap: anywhere;
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(34, 58, 68, 0.88);
  border: 1px solid rgba(122, 162, 172, 0.32);
  font-size: 0.75rem;
  line-height: 1.2;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.badge.muted { color: var(--muted); }
.badge.is-boss {
  background: rgba(96, 46, 22, 0.92);
  color: #ffe294;
  border: 1px solid #f0cb72;
}
.badge.is-danger {
  background: rgba(118, 30, 24, 0.92);
  color: #ffd5cc;
  border: 1px solid #f07660;
  animation: ff-danger-pulse 1.2s ease-in-out infinite;
}

@keyframes ff-danger-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(228, 93, 74, 0.45); }
  50% { box-shadow: 0 0 0 4px rgba(228, 93, 74, 0); }
}

[hidden] { display: none !important; }

input[type="text"], input[type="number"], input[type="search"], select, textarea {
  width: 100%;
  max-width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #0c161b;
  color: var(--ink);
  font-size: 16px;
}

textarea { min-height: 96px; resize: vertical; }

a { color: var(--gold); }
img, svg, video { max-width: 100%; height: auto; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

::selection { background: var(--gold); color: var(--gold-ink); }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.shell {
  --topbar-height: 52px;
  --board-left: 0px;
  --board-width: 100%;
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  min-width: 0;
  overflow: hidden;
}

.topbar {
  position: absolute;
  z-index: 50;
  top: 0;
  left: 0;
  right: 0;
  display: none;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  max-height: 42vh;
  overflow: auto;
  padding: max(6px, env(safe-area-inset-top)) 10px 6px;
  background: rgba(11, 19, 24, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(200, 162, 90, 0.3);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
}

.shell.is-menu .topbar { display: flex; }

.brand { flex: 1 1 8rem; min-width: 0; }
.brand-title { margin: 0; font-size: 1.05rem; color: #f6e6be; letter-spacing: 0.02em; }
.brand-sub { margin: 0; font-size: 0.78rem; }

.top-tools, .nav-scroll, .speed-row, .hud-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.nav-scroll, .speed-row {
  flex-wrap: nowrap;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
  max-width: 100%;
}

.nav-scroll > .btn, .speed-row > .btn { flex: 0 0 auto; }

.nav-scroll { flex: 1 1 12rem; }

.top-tools { flex: 0 1 auto; }
.hud-controls {
  flex: 1 1 100%;
  flex-wrap: nowrap;
  justify-content: space-between;
  order: 3;
  margin-left: 0;
  max-width: 100%;
  pointer-events: auto;
}

/* Flattened on wide screens so the status line stays under the controls.
   On a phone the box is real and the message overlays it. */
.hud-main { display: contents; }
.hud-message { order: 5; flex: 1 0 100%; }

.shell-body {
  position: absolute;
  inset: 0;
  min-width: 0;
  min-height: 0;
  display: block;
  overflow: hidden;
}

/* The board keeps its 360×640 ratio and stays centered sideways.
   It starts at the top, so the fight HUD overlays the field instead of
   sitting in the letterbox above a vertically centered board. */
.field-slot {
  container-type: size;
  position: absolute;
  inset: 0;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: start center;
  overflow: hidden;
}

.field-frame {
  position: relative;
  aspect-ratio: 360 / 640;
  width: min(100%, calc(100dvh * 360 / 640));
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 0 0 1px rgba(132, 168, 178, 0.22), 0 18px 54px rgba(0, 0, 0, 0.65);
}

.field {
  display: block;
  width: 100%;
  height: 100%;
  background: #101d24;
  touch-action: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  user-select: none;
}

.shell.is-paused .field-frame::after,
.shell.is-placing .field-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 0 3px rgba(230, 197, 116, 0.92);
}

.shell.is-placing .field-frame::after {
  box-shadow: inset 0 0 0 3px rgba(120, 210, 156, 0.96);
}

.panel-wrap {
  display: none;
  position: absolute;
  z-index: 28;
  left: 50%;
  top: calc(var(--topbar-height, 52px) + 8px);
  bottom: auto;
  transform: translateX(-50%);
  width: min(440px, calc(100% - 24px));
  max-height: min(46vh, 420px);
  min-width: 0;
  overflow: auto;
  padding: 8px;
  overscroll-behavior: contain;
  border: 1px solid rgba(200, 162, 90, 0.42);
  border-radius: 16px;
  background: rgba(11, 20, 25, 0.94);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}

.shell.is-unit-open .panel-wrap:not(:has([data-ui="panel"]:empty)) { display: block; }
.panel-wrap:has([data-ui="panel"]:empty) { display: none; }

/* Dock the stats card in the empty margin beside the board. The phone overlay
   stays centered above the slots when there is no margin. */
.shell.has-side-card.is-unit-open .panel-wrap:not(:has([data-ui="panel"]:empty)) {
  --side-card-width: min(360px, calc(var(--board-left) - 24px));
  left: calc(var(--board-left) - var(--side-card-width) - 12px);
  right: auto;
  transform: none;
  width: var(--side-card-width);
  max-height: calc(100dvh - var(--topbar-height, 52px) - 16px);
}

/* Phone card sits on the fence. The range arc stays in the field above it. */
@media (max-width: 899px) {
  .shell.is-unit-open:not(.has-side-card) .panel-wrap:not(:has([data-ui="panel"]:empty)) {
    top: auto;
    bottom: calc(100% - (var(--board-top) + var(--board-height) * 512 / 640) + 8px);
    max-height: 160px;
    width: min(440px, calc(var(--board-width, 100%) - 12px));
    padding: 6px;
  }
}

@media (max-width: 899px) {
  .brand-sub { display: none; }
  .brand-title { font-size: 1rem; }
  .topbar {
    gap: 6px;
    max-height: none;
    padding-block: 4px;
  }
  .hud { gap: 4px; padding-block: 6px; }
  .meter-track { height: 8px; }
}

/* Fight chrome uses the board box. The side margins stay empty. */
.hud {
  container-type: inline-size;
  position: absolute;
  z-index: 20;
  top: 0;
  left: var(--board-left, 0px);
  width: var(--board-width, 100%);
  right: auto;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  max-height: none;
  overflow: visible;
  padding: max(6px, env(safe-area-inset-top)) 8px 8px;
  background: linear-gradient(180deg, rgba(7, 13, 17, 0.9) 0%, rgba(7, 13, 17, 0.62) 72%, transparent 100%);
  border: none;
  pointer-events: none;
}

.shell.is-menu .hud { display: none; }
.hud .btn, .hud .speed-row, .hud .field-bar { pointer-events: auto; }
.hud-quiet { display: none !important; }

.hud-meters {
  display: flex;
  flex: 1 1 100%;
  order: 0;
  align-items: center;
  gap: 8px;
  min-width: 7rem;
  pointer-events: none;
}

.hud-meters > .meter {
  flex: 1 1 auto;
  min-width: 0;
}

.meter-head {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: baseline;
  margin-bottom: 3px;
  min-width: 0;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
}

.meter-label { color: #b7ccd3; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.meter-value {
  font-variant-numeric: tabular-nums;
  font-size: 0.84rem;
  font-weight: 700;
  text-align: end;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.meter-track {
  height: 9px;
  border-radius: 999px;
  background: rgba(8, 15, 19, 0.92);
  border: 1px solid rgba(114, 156, 166, 0.38);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.65);
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #92e3b2 0%, #58b87d 100%);
  transition: width 140ms ease;
}
.meter-fill.is-mid { background: linear-gradient(180deg, #f5d47a 0%, #d29c3e 100%); }
.meter-fill.is-low { background: linear-gradient(180deg, #f47c68 0%, #cc3d2e 100%); }
.meter-fill.is-xp { background: linear-gradient(180deg, #98d8f0 0%, #589ec0 100%); }

.hud-stats {
  display: flex;
  flex: 1 1 100%;
  order: 1;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 4px;
  align-items: center;
  pointer-events: none;
}

.hud-stats::-webkit-scrollbar { display: none; }

.hud-stats > * {
  white-space: nowrap;
  flex-shrink: 0;
}

.hud-stats .badge {
  padding: 2px 6px;
  font-size: 0.71rem;
  min-height: 22px;
}

.hud-chip {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 6.5px;
  border-radius: 999px;
  font-size: 0.71rem;
  font-weight: 700;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}

.hud-energy-chip {
  background: rgba(78, 58, 18, 0.88);
  border: 1px solid rgba(245, 204, 88, 0.56);
  color: #fce289;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
}

.hud-surge-chip {
  background: rgba(18, 52, 66, 0.88);
  border: 1px solid rgba(114, 214, 240, 0.52);
  color: #b4eeff;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
}

.hud-surge-chip.is-active {
  border-color: #f5cc58;
  background: rgba(34, 88, 108, 0.95);
  color: #fff8d6;
  box-shadow: 0 0 10px rgba(126, 226, 255, 0.55);
}

.hud-surge-chip.is-empty {
  opacity: 0.58;
}

.hud-sortie {
  background: rgba(30, 44, 50, 0.88);
  border: 1px solid rgba(200, 162, 90, 0.38);
  color: #ead6a4;
  font-weight: 600;
}

.stat {
  display: inline-flex;
  gap: 3px;
  align-items: baseline;
  min-height: 22px;
  min-width: 0;
  padding: 2px 6.5px;
  border-radius: 999px;
  background: rgba(13, 24, 30, 0.84);
  border: 1px solid rgba(110, 150, 160, 0.34);
  font-size: 0.71rem;
}

.stat-label { color: var(--muted); font-size: 0.69rem; }
.stat-value { font-variant-numeric: tabular-nums; color: #f6f2e6; }
.stat small { color: #9ac5d2; font-size: 0.66rem; font-variant-numeric: tabular-nums; }

.hud-message {
  margin: 0;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(34, 56, 44, 0.92);
  border: 1px solid rgba(112, 178, 134, 0.45);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}

.hud-message:empty { display: none; }

/* Two battle-HUD lines. A long wave note clamps there instead of covering the meters. */
.hud-hint {
  order: 5;
  flex: 1 0 100%;
  margin: 0;
  min-width: 0;
  max-width: 100%;
  padding: 2px 8px;
  border-radius: 7px;
  background: rgba(24, 42, 36, 0.9);
  border: 1px solid rgba(102, 162, 124, 0.38);
  color: var(--ink);
  font-size: 0.76rem;
  line-height: 1.35;
  max-height: 2.7em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  pointer-events: none;
}

.hud-hint:empty { display: none; }
.hud-hint.has-icon { position: relative; padding-left: 30px; }
.hud-hint .catalog-icon[data-hint-icon] {
  position: absolute;
  left: 4px;
  top: 2px;
  width: 22px;
  height: 22px;
  min-width: 22px;
  min-height: 22px;
}

/* Frontline tactical defense construction bar */
.field-bar {
  order: 4;
  flex: 1 1 100%;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
  pointer-events: auto;
}

.field-bar .field-btn {
  width: 100%;
  min-height: 44px;
  min-width: 0;
  padding: 3px 5px 3px 7px;
  font-size: 0.72rem;
  font-weight: 650;
  line-height: 1.15;
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: normal;
  border-radius: 9px;
  background: linear-gradient(180deg, rgba(24, 42, 50, 0.92) 0%, rgba(14, 26, 32, 0.95) 100%);
  border: 1px solid rgba(114, 156, 166, 0.42);
  color: #edf2f4;
  font-variant-numeric: tabular-nums;
}

.field-bar .field-btn--bulwark {
  box-shadow: inset 3px 0 0 #8fb4cc;
}

.field-bar .field-btn--spikes {
  box-shadow: inset 3px 0 0 #e0825a;
}

.field-bar .field-btn--flare {
  box-shadow: inset 3px 0 0 #f5cc58;
}

.field-bar .field-btn[aria-pressed="true"],
.field-bar .field-btn.is-active {
  border-color: #f5d273;
  background: linear-gradient(180deg, rgba(96, 74, 28, 0.94) 0%, rgba(56, 42, 16, 0.96) 100%);
  color: #fff6d6;
  box-shadow: inset 0 0 0 1px #f5d273, 0 0 12px rgba(245, 204, 88, 0.36);
}

.field-bar .field-btn:disabled {
  opacity: 0.46;
}

/* The fight HUD is an overlay. It must not become a column that covers the field. */
@media (max-width: 899px) {
  .hud-main { display: contents; }

  .hud-message:not(:empty) {
    max-height: 2.8em;
    margin: 0;
    overflow: auto;
    overscroll-behavior: contain;
  }

  .hud-hint:not(:empty) {
    display: -webkit-box;
    flex: 1 0 100%;
    height: auto;
    max-height: 2.7em;
    white-space: normal;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}

[data-ui="overlay"],
[data-ui="menu"] {
  display: none;
  position: absolute;
  z-index: 30;
  left: 0;
  right: 0;
  top: var(--topbar-height, 52px);
  bottom: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  min-width: 0;
}

[data-ui="overlay"] {
  background: rgba(7, 13, 17, 0.82);
}

[data-ui="menu"] {
  z-index: 40;
  background:
    radial-gradient(900px 520px at 50% -6%, rgba(40, 78, 94, 0.36) 0%, transparent 60%),
    linear-gradient(180deg, #0c161d 0%, #091015 100%);
}

[data-ui="overlay"].is-open,
[data-ui="menu"].is-open { display: block; }

.shell.is-draft [data-ui="overlay"] {
  left: var(--board-left);
  right: auto;
  width: var(--board-width);
  max-width: 100%;
  padding: 8px;
  background: transparent;
  pointer-events: none;
  bottom: auto;
  max-height: min(48vh, 380px);
  overflow: auto;
}

.shell.is-draft [data-ui="overlay"] > * { pointer-events: auto; }

.drag-ghost {
  position: fixed;
  z-index: 36;
  width: 44px;
  height: 44px;
  margin: 0;
  pointer-events: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  border: 2px solid #f0cb72;
  background: rgba(16, 30, 38, 0.95);
  color: #f3efe4;
  font: 700 11px/1.1 sans-serif;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
  transform: translate(-50%, -50%);
}

.drag-ghost[hidden] { display: none; }
.drag-ghost.is-illegal { border-color: #e7a08a; }
.drag-ghost.is-empty { border-color: #7ecea0; }
.drag-ghost.is-merge { border-color: #f0cb72; box-shadow: 0 0 14px rgba(240, 203, 114, 0.5); }
.drag-ghost.is-snapping { transition: left 140ms ease, top 140ms ease; }

/* Placing stays a top banner so the defender slots (bottom of the field) still receive taps.
   Direct children keep clicks; empty overlay space does not block the canvas. */
.shell.is-placing [data-ui="overlay"] {
  left: var(--board-left);
  right: auto;

  // How to play. Bodies are the help* keys; titles can reuse the short labels.
  ['howto', 'How to play', '怎么玩'],
  ['howtoLead', 'You decide what is built. The fight plays itself.', '建造由你决定，战斗自动进行。'],
  ['helpOverview', 'Enemies enter from the top and move toward one shared fence. You plan, draft, and merge. The hero and towers attack on their own.', '敌人从上方进入，朝同一道栅栏前进。你负责布阵、整备和合成。英雄与防御塔会自动攻击。'],
  ['helpPlacement', 'Drag a defender to an empty slot to move it, or onto a compatible tower to preview and confirm a merge. The fight keeps running. Pause, a draft, and the menu still allow the same actions. An illegal drop snaps back. Moving the hero only changes its place.', '把防守者拖到空位即可移动，拖到可以合成的防御塔上即可预览并确认合成。战斗会继续进行。暂停、整备和菜单里也可以这样做。非法放置会弹回。移动英雄只改变位置。'],
  ['helpMerge', 'Choose two different occupied slots and preview the result, including while the fight is running. The same type and rank rise by one rank, up to rank 4. Different base types of equal rank become that recipe\'s hybrid. A hybrid merges only with the same hybrid. The hero never merges. Cancel, or an invalid pair, keeps both units.', '选择两个不同的已占用格子并先预览结果，战斗进行中也可以。同种同阶会升 1 阶，最高 4 阶。不同的基础塔在同阶时会变成配方对应的混合单位。混合单位只能与相同的混合单位合成。英雄永不合成。取消或组合无效时，双方都会保留。'],
  ['helpDraft', 'Kills grant XP. At the threshold the fight pauses and three cards appear over the field. Tap a card to take it. There is no confirm button. A tower is placed with a second tap. On a full board you can still upgrade the hero or replace a tower. Canceling placement keeps those same three choices. Nothing is granted twice.', '击杀会获得经验。达到阈值时战斗暂停，三张卡叠在战场上。点一张卡即可选定，没有确认按钮。选塔之后，再点一个格子即可放置。格子占满时，仍可升级英雄或替换一座防御塔。取消放置会保留原来的三选一，不会因此多得一次。'],
  ['helpFence', 'Enemies attack only the shared fence. Defenders have no health. If fence HP reaches zero, the run is lost.', '敌人只攻击共用栅栏。防守者没有生命值。栅栏生命归零，本局失败。'],
  ['helpRange', 'Foremost targets the enemy closest to the fence inside the range circle. Switch targeting to high priority, strongest or weakest.', '最前优先会攻击射程内最靠近栅栏的敌人，也可切换为高危、最强或最弱优先。'],
  ['helpSpeed', 'Speeds are 1×, 1.5×, 3×, and 10×. They share one simulation clock, so attacks, status timers, and rewards are not sped past that clock or skipped. Pause stops the fight. Hiding the page stops it too. If you paused yourself, that pause remains when you return.', '速度有 1×、1.5×、3× 和 10×。它们共用一个模拟时钟，攻击、状态时间和报酬不会超出这个时钟，也不会被跳过。暂停会停止战斗。隐藏页面也会停止。如果你亲手暂停，回到页面后暂停仍然保留。'],
  ['helpHero', 'The run starts with one hero in the front center, and no other towers. The hero fights automatically, never merges, and cannot be sold or replaced.', '每局开始时，前排中央只有一名英雄，没有其他防御塔。英雄自动战斗，不能合成、出售或替换。'],
  ['helpRewards', 'Victory and defeat pay currency once. Abandoning a fresh run before 30 seconds and 3 kills pays nothing. Higher difficulties multiply the reward. Reloading does not pay again.', '胜利和失败都会发放一次货币。不足 30 秒且击杀少于 3 就放弃，没有报酬。难度越高，报酬倍率越高。重新加载不会再次发放。'],
  ['helpEquipment', 'Currency buys equipment and permanent hero upgrades. Bonuses are bounded and give a head start. Normal is playable without them. Purchases apply to later runs. This fight keeps the bonuses it started with.', '货币可以购买装备和英雄的永久升级。加成有上限，只提供开局优势。不买它们也能游玩标准难度。购买从之后的对局生效。这一局仍使用开局时的加成。'],
  ['helpLanguage', 'Use 中 / EN at any time. Switching language keeps the current run, board, and rewards.', '可以随时使用中 / EN。切换语言会保留当前对局、棋盘和报酬。'],
  ['helpLanes', 'There are no lanes. Enemies appear more often near the middle, then drift sideways a little, and stay inside the field.', '没有分路。敌人更常在中间出现，随后略微横向漂移，并始终留在场地内。'],
  ['helpWin', 'Clear the scheduled waves to win. You can keep going in endless afterward. If the fence falls first, the run is a defeat.', '清完排定的波次即胜利。之后可以进入无尽。若栅栏先倒下，本局失败。'],
  ['helpBoss', 'Bosses arrive on the wave schedule. They still attack only the fence. Their names and traits are in the codex.', '首领会按波次时间表出现，同样只攻击栅栏。名字和特点可以在图鉴中查看。'],
  ['helpSave', 'This browser stores the profile and one paused run. Export a backup or import one. A damaged file does not replace a valid save. Opening a saved run starts paused.', '此浏览器会保存档案和一局暂停中的战斗。可以导出或导入备份。损坏的文件不会覆盖有效存档。打开已保存的对局时，会先处于暂停。'],
  ['helpSameType', 'Two units of the same type and the same rank become one unit of the next rank, up to rank 4. Stats grow. The role stays the same.', '两座种类相同、阶数相同的单位会合成下一阶，最高 4 阶。能力提高，职能不变。'],
  ['helpHybrid', 'Two different base towers of equal rank become the hybrid named in the recipe. Read the result before you confirm. Hybrids do not mix with a different type.', '两座不同的基础塔在同阶时，会变成配方里的混合单位。确认前请先看结果。混合单位不能再与另一种类混合。'],
  ['helpStatuses', 'Burn, poison, slow, stun, and brittle appear on the enemy. Slow changes how fast that enemy moves right now, not its base speed. Damage over time stops if the enemy dies.', '燃烧、中毒、减速、眩晕和易伤会显示在敌人身上。减速改变的是它此刻的移动速度，而不是基础速度。敌人死亡后，持续伤害会停止。'],
  ['helpDifficulty', 'Easy, Normal, Hard, and Nightmare change enemy health, speed, damage, numbers, fence HP, and the reward multiplier.', '轻松、标准、困难和噩梦会改变敌人的生命、速度、伤害和数量，以及栅栏生命和报酬倍率。'],
  ['helpReplace', 'Replacing a tower asks for confirmation and removes that tower. The hero\'s slot always refuses a replacement.', '替换防御塔前会要求确认，并移除那座塔。英雄所在的格子始终不能替换。'],
  ['helpSupport', 'Support towers still fire on their own. Their aura boosts allies inside its range. The bonus is capped.', '支援塔自己也会攻击。它们的光环会强化范围内的友军，加成有上限。'],
  ['helpCrit', 'A critical hit deals multiplied damage and shows a clear impact. Chance and multiplier are listed on the unit.', '暴击造成倍率伤害，并有清楚的命中反馈。暴击率和倍率写在单位面板上。'],
  ['helpTouch', 'Buttons are large enough to tap. Choose a slot on the field, then confirm in the panel. Essential actions are not hidden behind hover.', '按钮足够大，便于点按。先在场上选择格子，再在面板中确认。关键操作不需要靠悬停才能找到。'],

  for (const part of raw.split(/[^a-z0-9]+/)) push(canonBase(part));
  if (found.length >= 2) return pairKey(found[0], found[1]);
  const tokens = [...BASE_TYPES, ...Object.keys(ALIASES).filter((key) => BASE_SET.has(ALIASES[key]))];
  tokens.sort((a, b) => b.length - a.length);
  const hits = [];
  for (const token of tokens) {
    if (!raw.includes(token)) continue;
    const base = BASE_SET.has(token) ? token : ALIASES[token];
    if (base && !hits.includes(base)) hits.push(base);
  }
  if (hits.length >= 2) return pairKey(hits[0], hits[1]);
  return null;
}

function findPair(unit, typeName) {
  return pairFromList(unit.parents)
    || pairFromList(unit.ingredients)
    || pairFromList(unit.components)
    || pairFromList(unit.sourceTypes)
    || pairFromIdString(typeName);
}

function accentFor(name) {
  const accents = ['f', 'L', 'Z', 'Q', 't', 'b', 'c', 'v'];
  let hash = 2166136261;
  const text = String(name || 'unknown');
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return accents[(hash >>> 0) % accents.length];
}

function resolveVisual(unit) {
  const typeName = canonToken(unit.type);
  const kind = typeof unit.kind === 'string' ? unit.kind.toLowerCase() : '';
  if (kind === 'hero' || typeName === 'hero') return {family: 'hero', key: 'hero'};
  const base = BASE_SET.has(typeName) ? typeName : '';
  if (base && kind !== 'hybrid') return {family: 'tower', key: base};
  const pair = findPair(unit, typeName);
  if (pair) return {family: 'hybrid', key: pair};
  const accent = accentFor(typeName || kind || 'hybrid');
  return {family: 'unknown', key: `unknown:${accent}`, accent};
}

function createPainter(frame) {
  const cells = Array.from({length: H}, () => Array(W).fill('.'));
  return {
    frame,
    cells,
    px(x, y, color) {
      const ix = Math.round(x);
      const iy = Math.round(y);
      if (ix < 0 || iy < 0 || ix >= W || iy >= H || !color || color === '.' || !PALETTE[color]) return;
      cells[iy][ix] = color;
    },
    fill(x, y, w, h, color) {
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) this.px(x + i, y + j, color);
      }
    },
    hline(x, y, w, color) { this.fill(x, y, w, 1, color); },
    vline(x, y, h, color) { this.fill(x, y, 1, h, color); }
  };
}

function mx(x) {
  return W - 1 - x;
}

function speckle(p, x, y, w, h, base, dark, light) {
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const n = (i * 17 + j * 11) & 15;
      p.px(x + i, y + j, n === 0 ? light : n < 3 ? dark : base);
    }
  }
}

function oval(p, cx, cy, rx, ry, color, test) {
  if (!(rx > 0) || !(ry > 0)) return;
  const y0 = Math.floor(cy - ry);
  const y1 = Math.ceil(cy + ry);
  const x0 = Math.floor(cx - rx);
  const x1 = Math.ceil(cx + rx);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const nx = (x + 0.5 - cx) / rx;
      const ny = (y + 0.5 - cy) / ry;
      if (nx * nx + ny * ny <= 1 && (!test || test(x, y))) p.px(x, y, color);
    }
  }
}

function drawFlame(p, cx, top, height, style) {
  const cols = {
    fire: ['a', 'A', 'f', 'F'],
    green: ['q', 'Q', 'g', 'G'],
    steam: ['l', 'L', 'E', 'i'],
    plasma: ['z', 'Z', 'a', 'f']
  }[style] || ['a', 'A', 'f', 'F'];
  const sway = [0, 1, 0, -1][p.frame] || 0;
  const tall = Math.max(3, height - (p.frame === 2 ? 1 : 0));
  for (let i = 0; i < tall; i++) {
    const t = tall <= 1 ? 0 : i / (tall - 1);
    const wobble = (i + p.frame * 2) % 4 === 0 ? 1 : 0;
    const half = Math.max(0, Math.round((1 - t) * 3.4 + wobble * (1 - t)));
    const y = top + i;
    const x = cx + (t > 0.4 ? sway : 0);
    const col = cols[t < 0.2 ? 0 : t < 0.48 ? 1 : t < 0.75 ? 2 : 3];
    p.hline(x - half, y, half * 2 + 1, col);
    if (half > 0 && (i + p.frame) % 3 === 0) p.px(x, y, cols[0]);
  }
}

function drawCrystal(p, cx, top, height, wide) {
  const mid = top + Math.max(1, Math.floor(height * 0.42));
  const bot = top + height - 1;
  for (let y = top; y <= bot; y++) {
    const span = y <= mid ? (y - top) / Math.max(1, mid - top) : (bot - y) / Math.max(1, bot - mid);
    const half = Math.max(0, Math.round(span * wide));
    for (let x = cx - half; x <= cx + half; x++) {
      let color = 'L';
      if (x === cx - half || x === cx + half) color = 'I';
      else if (x < cx - 1) color = 'i';
      else if ((y + p.frame * 3) % 7 === 0 && x === cx) color = 'W';
      else if (x === cx) color = 'l';
      p.px(x, y, color);
    }
  }
  p.px(cx, top, 'W');
}

function drawCoils(p, cx, top, count, gap) {
  for (let i = 0; i < count; i++) {
    const y = top + i * gap;
    p.hline(cx - 5, y, 11, 'U');
    p.hline(cx - 4, y + 1, 9, 'u');
    p.px(cx - 5, y + 1, 'B');
    p.px(cx + 5, y + 1, 'B');
    p.hline(cx - 2, y + 2, 5, 'V');
    p.px(cx, y + 1, (i + p.frame) % 2 === 0 ? 'Z' : 'z');
  }
  p.vline(cx, top - 1, count * gap + 1, 'n');
  p.vline(cx + 1, top - 1, count * gap, 'N');
}

function drawSparks(p, points) {
  const cols = ['z', 'Z', 'h', 'v'];
  for (let i = 0; i < points.length; i++) {
    const shift = (i + p.frame) % 2;
    p.px(points[i][0] + (i % 2 === 0 ? shift : -shift), points[i][1] - (p.frame === 3 && i === 0 ? 1 : 0), cols[(i + p.frame) % cols.length]);
  }
}

function drawZig(p, points, color, hot) {
  for (let i = 0; i < points.length - 1; i++) {
    const [x0, y0] = points[i];
    const [x1, y1] = points[i + 1];
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      p.px(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), (s + p.frame) % 3 === 0 ? hot : color);
    }
  }
}

function drawFlag(p, x, y, w, h) {
  const ox = [0, 1, 1, 0][p.frame];
  speckle(p, x + ox, y, w, h, 't', 'T', 'D');
  p.hline(x + ox, y, w, 'D');
  p.vline(x + ox, y, h, 'T');
  p.vline(x + ox + w - 1, y, h, 'T');
  const cx = x + ox + Math.floor(w / 2);
  const cy = y + Math.floor(h / 2);
  p.px(cx, cy - 1, 'h');
  p.px(cx, cy, p.frame % 2 === 0 ? 'H' : 'b');
  p.px(cx - 1, cy + 1, 'E');
  p.px(cx + 1, cy + 1, 'E');
  p.px(cx, cy + 2, 'T');
  p.px(x + ox + 2, y + 3, 'E');
  p.px(x + ox + w - 3, y + h - 3, 'T');
}

function drawBow(p, limbHi, limb, limbDk, stringC, stock) {
  const pts = [[5, 23], [6, 22], [7, 21], [8, 20], [9, 19], [10, 18], [11, 17], [12, 16], [13, 16], [14, 15], [15, 15]];
  for (const [x, y] of pts) {
    p.px(x, y, limbHi);
    p.px(x, y + 1, limb);
    p.px(x, y + 2, limbDk);
    p.px(mx(x), y, limbHi);
    p.px(mx(x), y + 1, limb);
    p.px(mx(x), y + 2, limbDk);
  }
  p.fill(4, 24, 3, 2, 'N');
  p.fill(mx(6), 24, 3, 2, 'N');
  p.px(5, 24, 'M');
  p.px(mx(5), 24, 'M');
  p.hline(12, 17, 16, stringC);
  speckle(p, 14, 20, 12, 11, stock, 'R', 'Y');
  p.hline(14, 22, 12, 'N');
  p.hline(14, 27, 12, 'n');
  p.fill(18, 17, 4, 4, 'r');
  p.vline(18, 17, 4, 'N');
  p.vline(21, 17, 4, 'N');
  p.px(15, 22, 'b');
  p.px(24, 22, 'b');
}

function drawQuarrel(p, tip, shaft, lift = 0) {
  const y = 4 + lift;
  p.px(19, y, tip);
  p.px(20, y, tip);
  p.px(18, y + 1, tip);
  p.px(21, y + 1, tip);
  p.px(19, y + 1, 'M');
  p.px(20, y + 1, 'W');
  p.vline(19, y + 2, 10, shaft);
  p.vline(20, y + 2, 10, 'n');
  p.px(17, y + 10, 'Y');
  p.px(18, y + 9, 'Y');
  p.px(22, y + 10, 'Y');
  p.px(21, y + 9, 'r');
}

function drawWinch(p, rank) {
  p.fill(16, 23, 5, 5, 'N');
  p.fill(17, 24, 3, 3, 'n');
  p.px(18, 25, p.frame % 2 === 0 ? 'M' : 'b');
  p.px(17, 24, 'K');
  p.px(19, 26, 'K');
  if (rank >= 3) p.px(21, 23, 'H');
  if (rank >= 4) p.px(18, 22, 'h');
}

function drawFlask(p, cx, top, liquid, glassHi) {
  p.fill(cx - 1, top, 4, 2, 'Y');
  p.px(cx, top, 'y');
  p.fill(cx - 2, top + 2, 6, 2, 'r');
  p.vline(cx - 2, top + 2, 2, 'R');
  p.fill(cx - 1, top + 4, 4, 3, 'O');
  p.vline(cx - 1, top + 4, 3, 'o');
  p.vline(cx + 2, top + 4, 3, 'o');
  oval(p, cx + 0.5, top + 14, 8, 8, 'O');
  oval(p, cx + 0.5, top + 16, 6.2, 5.2, liquid, (_x, y) => y >= top + 14);
  p.hline(cx - 5, top + 14, 12, liquid === 'g' ? 'Q' : 'L');
  p.vline(cx - 4, top + 10, 4, glassHi);
  p.px(cx - 3, top + 11, 'W');
  const bubbleY = top + 12 + ((4 - p.frame + 8) % 5);
  p.px(cx - 2, bubbleY, 'q');
  p.px(cx + 2, bubbleY + 1, 'W');
  p.px(cx, top + 17, p.frame % 2 === 0 ? 'q' : 'Q');
}

function drawPlinth(p, rank) {
  speckle(p, 9, 31, 22, 7, 'x', 'X', 'w');
  p.fill(10, 32, 20, 2, 'w');
  p.fill(10, 35, 20, 2, 'X');
  p.fill(6, 33, 4, 5, 'X');
  p.fill(30, 33, 4, 5, 'X');
  p.px(7, 34, 'w');
  p.px(32, 34, 'w');
  p.px(13, 33, 'X');
  p.px(22, 36, 'k');
  p.px(18, 37, 'X');
  p.px(25, 34, 'k');
  if (rank >= 2) {
    p.px(10, 32, 'b');
    p.px(29, 32, 'b');
  }
  if (rank >= 4) {
    p.hline(10, 32, 20, 'b');
    p.px(6, 33, 'H');
    p.px(33, 33, 'H');
    p.px(6, 37, 'h');
    p.px(33, 37, 'h');
  }
}

function drawRankGems(p, rank) {
  // One upward chevron per rank. White reads on the ink plaque and on dark
  // stone. The crimson edge reads on gold trim, so the count stays a mark
  // rather than another gold highlight. An ink row sits between the marks
  // and the rank-4 band.
  const mark = 3;
  const gap = 2;
  const total = rank * mark + (rank - 1) * gap;
  let x = Math.floor((W - total) / 2);
  p.fill(x - 1, 34, total + 2, 4, 'K');
  for (let i = 0; i < rank; i++) {
    p.px(x, 35, 'W');
    p.px(x + 2, 35, 'W');
    p.px(x + 1, 36, 'W');
    p.px(x, 36, 'c');
    p.px(x + 2, 36, 'c');
    p.px(x + 1, 37, 'c');
    x += mark + gap;
  }
}

function drawLineage(p, pair) {
  const [a, b] = pair.split('+');
  // Sit on the plinth highlight, above the rank gems, so the two marks stay separate.
  p.fill(11, 32, 2, 2, ROLE[a] || 'E');
  p.fill(27, 32, 2, 2, ROLE[b] || 'E');
  p.px(11, 32, 'W');
  p.px(27, 32, 'W');
}

function drawHeroSeal(p) {
  p.fill(16, 17, 8, 7, 'H');
  p.fill(17, 18, 6, 5, 'B');
  p.vline(19, 18, 5, 'K');
  p.vline(20, 18, 5, 'K');
  p.px(17, 17, 'h');
  p.px(22, 17, 'W');
  p.px(16, 19, 'b');
  p.px(23, 20, 'b');
}

function drawStars(p, stars) {
  for (let i = 0; i < stars; i++) {
    const x = 3 + i * 3;
    p.px(x, 2, 'h');
    p.px(x - 1, 3, 'b');
    p.px(x, 3, 'H');
    p.px(x + 1, 3, 'b');
  }
}

function drawShadow(p) {
  p.hline(10, 39, 20, 'k');
  p.px(9, 39, 'k');
  p.px(30, 39, 'k');
}

function applyOutline(cells) {
  const marks = [];
  for (let y = 0; y < H - 1; y++) {
    for (let x = 0; x < W; x++) {
      if (cells[y][x] !== '.') continue;
      const near = (x > 0 && cells[y][x - 1] !== '.')
        || (x + 1 < W && cells[y][x + 1] !== '.')
        || (y > 0 && cells[y - 1][x] !== '.')
        || (y + 1 < H && cells[y + 1][x] !== '.');
      if (near) marks.push(x, y);
    }
  }
  for (let i = 0; i < marks.length; i += 2) cells[marks[i + 1]][marks[i]] = 'K';
}

  p.px(29, 3, 'n');
  p.px(27, 4, 'N');
  p.px(28, 4, 'M');
  p.px(29, 4, 'N');
  // Pointed hood, narrow face, sloping shoulders — not a rectangular block.

  p.hline(18, 6, 3, 'C');
  p.hline(17, 7, 5, 'C');
  p.hline(16, 8, 7, 'd');

  p.px(19, 8, 'h');

  p.px(17, 9, 's');
  p.px(21, 9, 's');
  p.px(18, 10, 'K');

  p.hline(16, 12, 8, 'C');

  p.hline(11, 23, 7, 'c');
  p.hline(22, 23, 7, 'e');
  p.hline(10, 24, 8, 'C');
  p.hline(22, 24, 8, 'd');

  p.fill(24, 14, 4, 5, 'p');
  p.px(27, 15, 'S');
  p.px(27, 16, 'y');
  p.px(8, 15, 'b');
  p.fill(7, 16, 5, 2, 'B');
  p.fill(6, 18, 7, 6, 'O');

  p.px(7, 19, 'W');

}

function paintBolt(p, rank) {
  drawBow(p, 'Y', 'r', 'R', rank >= 3 ? 'b' : 'M', 'r');
  drawQuarrel(p, 'M', 'N', p.frame === 1 ? -1 : 0);
  drawWinch(p, rank);
  if (rank >= 4) {
    p.px(19, 3, 'h');
    p.px(20, 3, 'W');
  }
}

function drawCoupling(p, rank) {
  p.fill(3, 27, 34, 3, 'X');
  p.hline(3, 27, 34, 'n');
  p.hline(5, 29, 30, 'k');
  p.fill(16, 17, 6, 7, 'N');
  p.hline(16, 17, 6, 'n');
  p.px(18, 19, p.frame % 2 ? 'b' : 'M');
  p.px(19, 21, 'k');
  if (rank >= 3) p.px(17, 18, 'H');
  if (rank >= 4) p.px(20, 18, 'h');
}

function drawCompactBow(p, ox, oy, rank) {
  const lift = p.frame === 1 ? -1 : 0;
  const cx = ox + 8;
  const y0 = oy + lift;
  p.fill(ox + 4, oy + 16, 9, 13, 'r');
  p.vline(ox + 4, oy + 16, 13, 'R');
  p.vline(ox + 12, oy + 16, 13, 'R');
  p.hline(ox + 4, oy + 16, 9, 'Y');
  p.hline(ox + 4, oy + 22, 9, 'N');
  p.hline(ox + 5, oy + 27, 7, 'n');
  p.fill(ox + 6, oy + 14, 5, 4, 'R');
  p.px(ox + 7, oy + 15, 'Y');
  p.fill(ox + 6, oy + 19, 5, 4, 'N');
  p.fill(ox + 7, oy + 20, 3, 2, 'n');
  p.px(ox + 8, oy + 20, p.frame % 2 ? 'b' : 'M');
  const limb = [[0, 18], [1, 17], [2, 16], [3, 15], [4, 14], [5, 13], [6, 12], [7, 12]];
  for (const [dx, dy] of limb) {
    p.px(ox + dx, oy + dy, 'Y');
    p.px(ox + dx, oy + dy + 1, 'r');
    p.px(ox + dx, oy + dy + 2, 'R');
    const right = ox + 16 - dx;
    p.px(right, oy + dy, 'Y');
    p.px(right, oy + dy + 1, 'r');
    p.px(right, oy + dy + 2, 'R');
  }
  p.fill(ox, oy + 19, 3, 2, 'N');
  p.fill(ox + 14, oy + 19, 3, 2, 'N');
  p.px(ox, oy + 19, 'n');
  p.px(ox + 16, oy + 19, 'n');
  p.hline(ox + 3, oy + 13, 11, 'N');
  p.px(cx, oy + 13, 'n');
  p.px(cx, y0, 'W');
  p.px(cx - 1, y0 + 1, 'n');
  p.px(cx, y0 + 1, 'M');
  p.px(cx + 1, y0 + 1, 'n');
  p.vline(cx, y0 + 2, 8, 'N');
  p.vline(cx + 1, y0 + 2, 8, 'k');
  p.px(cx - 2, y0 + 9, 'Y');
  p.px(cx - 1, y0 + 8, 'r');
  p.px(cx + 2, y0 + 8, 'r');
  p.px(cx + 3, y0 + 9, 'Y');
  if (rank >= 3) p.px(cx, Math.max(0, y0 - 1), 'h');
  if (rank >= 4) p.px(cx + 1, Math.max(0, y0 - 1), 'W');
}

function drawEmberBowl(p, cx, top, flameH, wide) {
  drawFlame(p, cx, top, flameH, 'fire');
  const rim = top + flameH;
  const depth = Math.max(6, 27 - rim);
  for (let i = 0; i < depth; i++) {
    const t = depth <= 1 ? 0 : i / (depth - 1);
    const half = Math.max(3, Math.round(wide * (1 - t * 0.2)));
    const y = rim + i;
    if (y > 29) break;
    let color = 'F';
    if (i === 0) color = 'n';
    else if (i === 2 || i === Math.floor(depth * 0.55)) color = 'X';
    else if (i === depth - 1) color = 'k';
    p.hline(cx - half, y, half * 2 + 1, color);
    if (color === 'F') p.px(cx - half + 1, y, 'u');
    if (i === 1) {
      p.px(cx - 1, y, p.frame % 2 ? 'a' : 'A');
      p.px(cx + 1, y, 'f');
    }
  }
  const baseY = Math.min(30, rim + depth);
  if (baseY <= 30) {
    const bw = Math.max(4, wide * 2 - 3);
    const bx = cx - Math.floor(bw / 2);
    p.fill(bx, baseY, bw, Math.max(1, 31 - baseY), 'N');
    p.hline(bx, baseY, bw, 'n');
  }
}

function drawCrystalMount(p, cx, top, height, wide) {
  const tall = Math.max(14, Math.min(height, 27 - top));
  drawCrystal(p, cx, top, tall, wide);
  const seat = top + tall;
  if (seat <= 30) {
    p.hline(cx - 4, seat, 9, 'N');
    p.px(cx - 4, seat, 'M');
    p.px(cx + 4, seat, 'M');
    if (seat + 1 <= 30) p.fill(cx - 2, seat + 1, 5, 30 - seat, 'I');
  }
}

function drawSparkColumn(p, cx, top, rank) {
  const sag = p.frame % 2;
  const rise = rank >= 4 ? 0 : 1;
  drawZig(p, [
    [cx, top + rise],
    [cx + 4, top + 3],
    [cx - 3, top + 6],
